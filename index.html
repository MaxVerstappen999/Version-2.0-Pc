<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  --bg:#090d15;
  --panel:#111a29;
  --line:#27364b;
  --blue:#59bdff;
  --purple:#9775ff;
  --text:#f4f7ff;
  --muted:#9baac0;
  --green:#65dbad;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
header{
  position:sticky;top:0;z-index:20;
  background:#090d15ed;backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:13px 5%;
  display:flex;justify-content:space-between;align-items:center;gap:18px
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1px;white-space:nowrap}
.logo{
  width:43px;height:43px;border-radius:12px;display:grid;place-items:center;
  color:#07101b;background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:900;font-size:19px
}
.brand span:last-child b{color:var(--blue)}
nav{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
nav a,.cart-button{
  padding:9px 11px;border-radius:9px;color:var(--muted);font-size:13px;
  border:0;background:transparent
}
nav a:hover,nav a.active,.cart-button:hover{background:#1a2940;color:white}
.cart-button{border:1px solid var(--line);color:white}
.cart-count{color:var(--blue);font-weight:800}
main{min-height:65vh}
.hero{
  padding:90px 8%;display:grid;grid-template-columns:1.1fr .9fr;
  gap:40px;align-items:center;min-height:510px;
  background:radial-gradient(ellipse at 80% 45%,#28386a66,transparent 42%)
}
.eyebrow{color:var(--blue);font-size:11px;font-weight:900;letter-spacing:2.5px;margin:0 0 12px}
h1{font-size:clamp(42px,6vw,72px);letter-spacing:-3px;line-height:1.04;margin:0 0 20px}
h1 span{background:linear-gradient(90deg,var(--blue),var(--purple));color:transparent;background-clip:text}
h2{font-size:30px;line-height:1.2;margin:0 0 14px}
h3{margin:8px 0}
.lead{color:var(--muted);font-size:17px;max-width:650px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;
  background:linear-gradient(110deg,#48b4ff,#9272ff);color:#07101b;
  border:0;border-radius:10px;font-weight:900
}
.btn:hover{filter:brightness(1.12)}
.btn.secondary{background:transparent;border:1px solid #52637d;color:white}
.hero-art{
  min-height:320px;border:1px solid #34435c;border-radius:24px;
  display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#172740,#101322 65%,#21183d)
}
.glow{
  width:235px;height:235px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#a0e7ff,#695aff 48%,#131b31 75%);
  box-shadow:0 0 80px #5279ff66
}
.hero-chip{
  position:absolute;width:135px;height:135px;border-radius:18px;
  background:#0b1424ed;border:2px solid #b9eaff;
  display:grid;place-items:center;text-align:center;font-size:27px;font-weight:900;
  transform:rotate(-10deg);box-shadow:0 0 35px #50bdff55
}
.hero-chip small{display:block;font-size:11px;color:var(--blue);letter-spacing:3px}
.hero-art-label{position:absolute;bottom:17px;color:#a8bad3;font-size:10px;letter-spacing:3px}
.section,.page{padding:55px 7%}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}
.section-heading a,.link{color:var(--blue);font-weight:800}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.category{
  padding:20px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(145deg,#152338,#101722);transition:.2s
}
.category:hover,.product:hover{transform:translateY(-3px);border-color:#6485b6}
.category .symbol{font-size:27px;color:var(--blue)}
.category p{margin:3px 0 0;color:var(--muted);font-size:13px}
.banner{
  margin:20px 7% 55px;padding:30px;border:1px solid #35466b;
  border-radius:18px;background:linear-gradient(110deg,#172b43,#23183e);
  display:flex;justify-content:space-between;align-items:center;gap:20px
}
.banner p{color:var(--muted);margin-bottom:0}
.page{max-width:1500px;margin:auto}
.page-title{margin-bottom:25px}
.page-title h1{font-size:clamp(36px,5vw,58px)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 15px}
.toolbar input{flex:1;min-width:220px}
.toolbar input,.toolbar select,.field{
  padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:#0e1725;color:white;outline:none
}
.toolbar input:focus,.toolbar select:focus,.field:focus{border-color:var(--blue)}
.toolbar select{min-width:155px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:17px}
.product{
  border:1px solid var(--line);border-radius:15px;overflow:hidden;
  background:#101827;transition:.2s;min-width:0
}
.product-photo{
  width:100%;height:210px;object-fit:contain;padding:13px;background:#f4f6fa;
  display:block
}
.photo-fallback{
  height:210px;background:linear-gradient(140deg,#e7eef8,#cbd9ee);
  color:#283a55;display:none;place-items:center;text-align:center;padding:20px;font-weight:700
}
.product-info{padding:17px}
.product-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{
  display:inline-block;background:#17314a;color:#8fd7ff;
  border-radius:5px;padding:4px 8px;font-size:10px;font-weight:900;letter-spacing:1px
}
.condition{font-size:11px;color:var(--green)}
.product h3{font-size:16px;line-height:1.35;min-height:43px}
.specs{font-size:12px;color:#d6eaff;margin:5px 0 12px}
.description,.compat{
  background:#0b1420;border-radius:9px;padding:10px;margin:9px 0;
  color:var(--muted);font-size:12px
}
.description b,.compat b{display:block;color:#a9dfff;margin-bottom:3px}
.price-row{display:flex;justify-content:space-between;align-items:center;margin:15px 0 12px}
.price{font-size:23px;font-weight:900}
.price-note{font-size:10px;color:var(--muted)}
.card-actions{display:flex;gap:8px}
.card-actions button{flex:1}
.small-btn{
  border:1px solid #40536f;background:#18263a;color:white;
  padding:9px;border-radius:8px;font-size:12px;font-weight:800
}
.small-btn.primary{background:#4caeff;color:#061322;border-color:#4caeff}
.empty{padding:35px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--muted);grid-column:1/-1}
.deal-grid,.build-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.deal,.build,.panel{
  border:1px solid var(--line);border-radius:16px;background:#111a29;padding:23px

.deal p,.build p,.muted{color:var(--muted);font-size:14px}
.deal .price{margin:18px 0}
.build-image{
  height:150px;border-radius:10px;margin:-5px -5px 17px;
  display:grid;place-items:center;background:linear-gradient(135deg,#172f4b,#332252);
  color:#d7edff;font-weight:900;letter-spacing:2px
}
.trade-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:25px}
.panel label{display:block;margin:14px 0 6px;color:var(--muted);font-size:13px}
.panel .field{width:100%}
.panel .btn{width:100%;margin-top:18px}
.result{background:#162942;padding:16px;border-radius:10px;margin-top:17px;color:#cfe5ff}
.result strong{display:block;color:#79d6ff;font-size:25px}
.result small{display:block;color:var(--muted);margin-top:4px}
.steps li{padding:7px 0;color:var(--muted)}
.about-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:30px 0}
.about-card{background:#111a29;border:1px solid var(--line);padding:20px;border-radius:14px}
.about-card p{color:var(--muted);font-size:13px}
.notice{padding:13px 15px;background:#121f30;border-left:3px solid var(--blue);color:#aebdd0;font-size:12px;margin:18px 0}
footer{
  border-top:1px solid var(--line);padding:25px 7%;display:flex;
  justify-content:space-between;gap:15px;color:#8b9ab0;font-size:12px
}
/* Shopping cart */
.overlay{
  position:fixed;inset:0;background:#0009;z-index:30;display:none
}
.overlay.open{display:block}
.cart-panel{
  position:fixed;right:0;top:0;height:100vh;width:min(420px,94vw);
  background:#111a29;border-left:1px solid var(--line);z-index:31;
  padding:23px;transform:translateX(105%);transition:.25s;overflow:auto
}
.cart-panel.open{transform:translateX(0)}
.cart-header{display:flex;justify-content:space-between;align-items:center}
.cart-item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}
.cart-item p{color:var(--muted);font-size:12px;margin:3px 0}
.cart-item button{background:none;border:0;color:#ff9696}
.cart-total{font-size:21px;font-weight:900;margin:18px 0}
.close-btn{background:#1c2b40;color:white;border:1px solid var(--line);padding:8px 12px;border-radius:8px}
@media(max-width:900px){
  header{align-items:flex-start;flex-direction:column}
  .hero{grid-template-columns:1fr;padding-top:55px}
  .category-grid{grid-template-columns:repeat(2,1fr)}
  .products,.deal-grid,.build-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:580px){
  nav{gap:1px}
  nav a{padding:7px;font-size:12px}
  .products,.deal-grid,.build-grid,.trade-grid,.about-grid{grid-template-columns:1fr}
  .category-grid{grid-template-columns:1fr 1fr}
  .hero{padding:48px 5%}
  .section,.page{padding:38px 5%}
  .banner{margin:20px 5%;align-items:flex-start;flex-direction:column}
  footer{flex-direction:column}
}
</style>
</head>

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function currentPage() {
  const requested = new URLSearchParams(location.search).get("page") || "home";
  return pageNames[requested] ? requested : "home";
}

function go(page) {
  location.href = "?page=" + encodeURIComponent(page);
}

function headerActive() {

function shopPage() {
  app.innerHTML = `
  <section class="page">
    <div class="page-title">

      <h1>Shop Hardware</h1>
      <p class="lead">Search models, compare specifications, and check compatibility.</p>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search RTX 3060, Ryzen, DDR5, SSD...">
      <select id="category">
        <option value="">All Categories</option>
        ${["GPU","CPU","RAM","SSD","PSU","AIO","Motherboard","Case"].map(c=>`<option value="${c}">${c}</option>`).join("")}
      </select>
      <select id="sort">
        <option value="featured">Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="az">Name: A to Z</option>
      </select>
    </div>
    <div class="meta"><span id="result-count"></span><span>Sample used/refurbished prices • USD</span></div>
    <div class="products" id="product-list"></div>
    <p class="notice">
      These are example listings, not confirmed inventory. Only list a part as
      tested or refurbished after you have actually inspected and tested it.
      Prices should be updated to match the exact model, condition, and market.
    </p>
  </section>`;

  const search = document.getElementById("search");
  const category = document.getElementById("category");
  const sort = document.getElementById("sort");
  const params = new URLSearchParams(location.search);

  if (params.has("category")) category.value = params.get("category");
  if (params.has("search")) search.value = params.get("search");

  function update() {
    const term = search.value.toLowerCase().trim();
    let list = products.filter(p => {
      const text = [p.name,p.brand,p.category,p.specs,p.description,p.compatibility].join(" ").toLowerCase();
      return text.includes(term) && (!category.value || p.category === category.value);
    });

    if (sort.value === "low") list.sort((a,b)=>a.price-b.price);
    if (sort.value === "high") list.sort((a,b)=>b.price-a.price);
    if (sort.value === "az") list.sort((a,b)=>a.name.localeCompare(b.name));

    document.getElementById("result-count").textContent =
      `${list.length} matching items`;

    document.getElementById("product-list").innerHTML =
      list.length ? list.map(productCard).join("") :
      `<div class="empty"><h2>No products found</h2><p>Try another search or category.</p></div>`;
  }

  search.addEventListener("input",update);
  category.addEventListener("change",update);
  sort.addEventListener("change",update);
  update();
}

function estimateTrade() {
  const value = Number(document.getElementById("trade-value").value);
  const condition = Number(document.getElementById("trade-condition").value);
  const result = document.getElementById("trade-result");

  if (!Number.isFinite(value) || value <= 0) {
    result.textContent = "Enter an estimated resale value greater than $0.";
    return;
  }

  const low = value * condition * .55;
  const high = value * condition * .70;

  result.innerHTML =
    "Possible sample buy-in range:" +
    `<strong>$${Math.round(low)} – $${Math.round(high)}</strong>` +
    "<small>Illustrative estimate only. The final offer may be different.</small>";
}

/* Shopping cart demonstration */
function saveCart() {
  localStorage.setItem("v2pc-cart",JSON.stringify(cart));
  updateCartCount();
}

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  saveCart();
  openCart();
}

function updateCartCount() {
  const count = Object.values(cart).reduce((sum,n)=>sum+n,0);
  document.getElementById("cart-count").textContent = count;
}

function openCart() {
  renderCart();
  document.getElementById("overlay").classList.add("open");
  document.getElementById("cart-panel").classList.add("open");
}

function closeCart() {
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("cart-panel").classList.remove("open");
}

function changeQuantity(id,amount) {
  cart[id] = (cart[id] || 0) + amount;
  if (cart[id] <= 0) delete cart[id];
  saveCart();
  renderCart();
}

function renderCart() {
  const entries = Object.entries(cart);
  let total = 0;

  if (!entries.length) {
    document.getElementById("cart-items").innerHTML =
      '<p class="muted">Your cart is empty. Add something from the shop.</p>';
  } else {
    document.getElementById("cart-items").innerHTML = entries.map(([id,qty]) => {
      const p = products.find(item=>item.id===id);
      if (!p) return "";
      total += p.price*qty;
      return `<div class="cart-item">
        <div><b>${safe(p.name)}</b><p>$${p.price.toFixed(2)} each · Quantity: ${qty}</p>
        <button onclick="changeQuantity('${id}',-1)">Remove one</button>
        <button onclick="changeQuantity('${id}',1)">Add one</button></div>
        <b>$${(p.price*qty).toFixed(2)}</b>
      </div>`;
    }).join("");
  }

  document.getElementById("cart-total").textContent = "Total: $" + total.toFixed(2);
  updateCartCount();
}
